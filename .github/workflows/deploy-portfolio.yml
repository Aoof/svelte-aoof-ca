name: Deploy portfolio

on:
  push:
    branches:
      - master
    paths:
      - 'content/**'
      - 'static/admin/**'
      - 'static/media/**'
      - 'src/**'
      - 'static/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'svelte.config.js'
      - 'vite.config.ts'
      - '.github/workflows/deploy-portfolio.yml'
  workflow_dispatch:

concurrency:
  group: portfolio-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Rebuild and restart portfolio
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy on Docker host
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          envs: DEPLOY_PATH,DEPLOY_REPO_PATH
          script: |
            set -eu
            git -C "$DEPLOY_REPO_PATH" pull --ff-only origin master
            cd "$DEPLOY_PATH"
            docker compose build portfolio
            docker compose up -d --no-deps portfolio
            docker compose ps portfolio
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_REPO_PATH: ${{ secrets.DEPLOY_REPO_PATH }}